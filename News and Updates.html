<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News and Updates - Tech Bridge Liberia</title>
    <link rel="stylesheet" href="./Style.CSS">
    <style>
        .news-updates-page {
            min-height: 60vh;
            padding: 72px 20px 90px;
            background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
        }

        .news-shell {
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            gap: 24px;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .news-card {
            background: #ffffff;
            border: 1px solid rgba(15, 52, 96, 0.1);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 36px rgba(15, 52, 96, 0.08);
        }

        .news-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #eef4fb;
        }

        .news-card-copy {
            padding: 22px;
            display: grid;
            gap: 12px;
        }

        .news-card-copy h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.45rem;
            line-height: 1.3;
        }

        .news-meta {
            color: var(--text-light);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .news-card-copy p {
            margin: 0;
            color: var(--text-light);
            line-height: 1.75;
        }

        .news-empty {
            min-height: 40vh;
        }

        @media (max-width: 900px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .news-updates-page {
                padding: 56px 20px 72px;
            }

            .news-card img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Tech Bridge LIberia-TBL</h1>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="./index about.html">About</a></li>
                    <li><a href="./Index Service.html">Services</a></li>
                    <li><a href="./Portfolia.html">Our Portfolia</a></li>
                    <li><a href="./Our Staff.html">Our Staffs</a></li>
                    <li><a href="./Contact.html">Contact</a></li>
                    <li><a href="./Policy.html">Policy</a></li>
                    <li><a href="./News and Updates.html">News and Updates</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="news-updates-page">
        <div class="news-shell" id="newsContainer"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Tech Bridge LIberia-TBL<br>
                All rights reserved.<br>
                Powered by Tech Bridge Liberia -TBL</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        const newsContainer = document.getElementById('newsContainer');

        menuToggle.addEventListener('click', function() {
            navMenu.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });

        const navLinks = navMenu.querySelectorAll('a');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navMenu.classList.remove('active');
                menuToggle.classList.remove('active');
            });
        });

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderNews(items) {
            if (!items.length) {
                newsContainer.className = 'news-shell news-empty';
                newsContainer.innerHTML = '';
                return;
            }

            newsContainer.className = 'news-shell';
            newsContainer.innerHTML = '<div class="news-grid">' + items.map((item) => {
                const body = escapeHtml(item.body).replace(/\r?\n/g, '<br>');
                return `
                    <article class="news-card">
                        <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.title)}">
                        <div class="news-card-copy">
                            <div class="news-meta">${escapeHtml(item.publish_date)} | ${escapeHtml(item.author_name)}</div>
                            <h2>${escapeHtml(item.title)}</h2>
                            <p>${body}</p>
                        </div>
                    </article>`;
            }).join('') + '</div>';
        }

        async function loadNews() {
            try {
                const response = await fetch('/api/news');
                if (!response.ok) {
                    newsContainer.className = 'news-shell news-empty';
                    newsContainer.innerHTML = '';
                    return;
                }

                const payload = await response.json();
                renderNews(Array.isArray(payload.items) ? payload.items : []);
            } catch (error) {
                newsContainer.className = 'news-shell news-empty';
                newsContainer.innerHTML = '';
            }
        }

        loadNews();
    </script>
    <script src="./active-nav.js"></script>
</body>
</html>
