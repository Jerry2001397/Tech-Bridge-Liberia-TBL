<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News and Updates - Tech Bridge Liberia</title>
    <link rel="stylesheet" href="./Style.CSS">
    <style>
        .news-updates-page {
            min-height: 60vh;
            padding: 72px 20px 90px;
            background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
        }

        .news-shell {
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            gap: 24px;
        }

        .news-toolbar {
            display: grid;
            gap: 14px;
        }

        .news-toolbar h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .news-filter-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .news-filter {
            padding: 10px 16px;
            border: 1px solid rgba(15, 52, 96, 0.35);
            border-radius: 999px;
            background: #ffffff;
            color: var(--primary-color);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .news-filter.is-active {
            background: var(--primary-color);
            color: #ffffff;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .news-card {
            background: #ffffff;
            border: 1px solid rgba(15, 52, 96, 0.1);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 18px 36px rgba(15, 52, 96, 0.08);
        }

        .news-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
            background: #eef4fb;
        }

        .news-card-copy {
            padding: 22px;
            display: grid;
            gap: 12px;
        }

        .news-card-copy h2 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.45rem;
            line-height: 1.3;
        }

        .news-meta {
            color: var(--text-light);
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .news-type-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 7px 12px;
            border: 1px solid rgba(15, 52, 96, 0.24);
            border-radius: 999px;
            color: var(--primary-color);
            font-size: 0.84rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .news-card-copy p {
            margin: 0;
            color: var(--text-light);
            line-height: 1.75;
        }

        .news-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(15, 52, 96, 0.1);
        }

        .news-card-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 11px 16px;
            border: 1px solid rgba(15, 52, 96, 0.2);
            border-radius: 12px;
            background: #ffffff;
            color: var(--primary-color);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .news-card-action:hover {
            background: #f5f9ff;
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(15, 52, 96, 0.08);
        }

        .news-empty {
            min-height: 40vh;
        }

        @media (max-width: 900px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .news-updates-page {
                padding: 56px 20px 72px;
            }

            .news-card img {
                height: 220px;
            }

            .news-card-actions {
                flex-direction: column;
            }

            .news-card-action {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Tech Bridge LIberia-TBL</h1>
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="./index about.html">About</a></li>
                    <li><a href="./Index Service.html">Services</a></li>
                    <li><a href="./Portfolia.html">Our Portfolia</a></li>
                    <li><a href="./Our Staff.html">Our Staffs</a></li>
                    <li><a href="./Contact.html">Contact</a></li>
                    <li><a href="./Policy.html">Policy</a></li>
                    <li><a href="./News and Updates.html">News and Updates</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="news-updates-page">
        <div class="news-shell" id="newsContainer"></div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Tech Bridge LIberia-TBL<br>
                All rights reserved.<br>
                Powered by Tech Bridge Liberia -TBL</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        const newsContainer = document.getElementById('newsContainer');
        const newsTypes = ['All', 'Partnership', 'Event', 'Contract', 'Recruitment', 'Travels', 'Other'];
        let allNewsItems = [];
        let activeNewsType = 'All';

        menuToggle.addEventListener('click', function() {
            navMenu.classList.toggle('active');
            menuToggle.classList.toggle('active');
        });

        const navLinks = navMenu.querySelectorAll('a');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navMenu.classList.remove('active');
                menuToggle.classList.remove('active');
            });
        });

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatLiberiaDateTime(value) {
            if (!value) {
                return '';
            }

            return new Intl.DateTimeFormat('en-LR', {
                timeZone: 'Africa/Monrovia',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            }).format(new Date(value));
        }

        function normalizeNewsType(value) {
            const normalized = String(value || '').trim();
            return newsTypes.includes(normalized) ? normalized : 'Other';
        }

        function getFilteredItems() {
            if (activeNewsType === 'All') {
                return allNewsItems;
            }

            return allNewsItems.filter((item) => normalizeNewsType(item.news_type) === activeNewsType);
        }

        function renderFilters() {
            return '<div class="news-toolbar">' +
                '<h2>News and Updates</h2>' +
                '<div class="news-filter-list">' +
                newsTypes.map((type) => {
                    const activeClass = activeNewsType === type ? ' is-active' : '';
                    return `<button class="news-filter${activeClass}" type="button" data-news-type="${escapeHtml(type)}">${escapeHtml(type)}</button>`;
                }).join('') +
                '</div>' +
            '</div>';
        }

        function renderNews(items) {
            const toolbar = renderFilters();
            if (!items.length) {
                newsContainer.className = 'news-shell news-empty';
                newsContainer.innerHTML = toolbar;
                attachFilterEvents();
                return;
            }

            newsContainer.className = 'news-shell';
            newsContainer.innerHTML = toolbar + '<div class="news-grid">' + items.map((item) => {
                const body = escapeHtml(item.body).replace(/\r?\n/g, '<br>');
                const newsType = normalizeNewsType(item.news_type);
                const shareUrl = buildNewsUrl(item);
                return `
                    <article class="news-card" id="news-${escapeHtml(item.id)}">
                        <img src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.title)}">
                        <div class="news-card-copy">
                            <span class="news-type-badge">${escapeHtml(newsType)}</span>
                            <div class="news-meta">${escapeHtml(formatLiberiaDateTime(item.created_at))} | ${escapeHtml(item.author_name)}</div>
                            <h2>${escapeHtml(item.title)}</h2>
                            <p>${body}</p>
                            <div class="news-card-actions">
                                <button class="news-card-action" type="button" data-copy-link="${escapeHtml(shareUrl)}">Copy Link</button>
                                <button class="news-card-action" type="button" data-share-link="${escapeHtml(shareUrl)}" data-share-title="${escapeHtml(item.title)}">Share News</button>
                            </div>
                        </div>
                    </article>`;
            }).join('') + '</div>';
            attachFilterEvents();
            scrollToHashTarget();
        }

        function buildNewsUrl(item) {
            return new URL(`./News and Updates.html#news-${encodeURIComponent(item.id)}`, window.location.href).toString();
        }

        async function copyNewsLink(url, button) {
            try {
                await navigator.clipboard.writeText(url);
                flashActionState(button, 'Copied');
            } catch (error) {
                flashActionState(button, 'Copy Failed');
            }
        }

        async function shareNewsLink(url, title, button) {
            if (navigator.share) {
                try {
                    await navigator.share({ title, url });
                    return;
                } catch (error) {
                    if (error && error.name === 'AbortError') {
                        return;
                    }
                }
            }

            await copyNewsLink(url, button);
        }

        function flashActionState(button, label) {
            if (!button) {
                return;
            }

            const originalLabel = button.dataset.originalLabel || button.textContent;
            button.dataset.originalLabel = originalLabel;
            button.textContent = label;
            window.clearTimeout(button._resetLabelTimer);
            button._resetLabelTimer = window.setTimeout(() => {
                button.textContent = originalLabel;
            }, 1800);
        }

        function scrollToHashTarget() {
            const hash = window.location.hash;
            if (!hash || !hash.startsWith('#news-')) {
                return;
            }

            const target = document.getElementById(hash.slice(1));
            if (!target) {
                return;
            }

            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function attachFilterEvents() {
            const filterButtons = newsContainer.querySelectorAll('[data-news-type]');
            filterButtons.forEach((button) => {
                button.addEventListener('click', function() {
                    activeNewsType = button.getAttribute('data-news-type') || 'All';
                    renderNews(getFilteredItems());
                });
            });
        }

        newsContainer.addEventListener('click', async function(event) {
            const copyButton = event.target.closest('[data-copy-link]');
            if (copyButton) {
                await copyNewsLink(copyButton.getAttribute('data-copy-link') || '', copyButton);
                return;
            }

            const shareButton = event.target.closest('[data-share-link]');
            if (shareButton) {
                await shareNewsLink(
                    shareButton.getAttribute('data-share-link') || '',
                    shareButton.getAttribute('data-share-title') || 'Tech Bridge Liberia News',
                    shareButton
                );
            }
        });

        async function loadNews() {
            try {
                const response = await fetch('/api/news');
                if (!response.ok) {
                    newsContainer.className = 'news-shell news-empty';
                    newsContainer.innerHTML = renderFilters();
                    attachFilterEvents();
                    return;
                }

                const payload = await response.json();
                allNewsItems = Array.isArray(payload.items) ? payload.items : [];
                renderNews(getFilteredItems());
            } catch (error) {
                newsContainer.className = 'news-shell news-empty';
                newsContainer.innerHTML = renderFilters();
                attachFilterEvents();
            }
        }

        loadNews();
    </script>
    <script src="./active-nav.js"></script>
</body>
</html>
